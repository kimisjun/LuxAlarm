# Robolectric ships an android-all runtime per API level; pin to the newest one it supports rather
# than following compileSdk/targetSdk, which move ahead of Robolectric's releases.
sdk=36
# Compose layouts need a realistic viewport. Robolectric's default 320x470 mdpi device makes
# LazyColumn items and Material3 components clip out of the semantics tree.
qualifiers=w411dp-h891dp-xhdpi
