<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Warmly — Night Planner</title><style>
*{box-sizing:border-box}body{margin:0;background:#d7d4cc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#232125;display:grid;place-items:center;min-height:100vh}.phone{width:min(100%,390px);height:min(844px,100vh);overflow:hidden;background:#f7f3ea;position:relative}.top{padding:50px 22px 24px;background:#242038;color:#fff;border-radius:0 0 34px 34px}.brand{font-size:14px;color:#d9ccec;letter-spacing:.08em}.top h1{font-size:36px;line-height:1.12;letter-spacing:-.04em;margin:16px 0 8px}.top p{margin:0;color:#dad3e0}.content{padding:22px;height:calc(100% - 230px);overflow:auto}.section-title{font-size:14px;color:#716c70;margin:5px 2px 10px}.plan{background:#fff;border-radius:24px;padding:6px 18px;box-shadow:0 8px 28px #332b2410}.row{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;background:transparent;padding:17px 0;border-bottom:1px solid #eee9e2;font:inherit;text-align:left}.row:last-child{border:0}.row span small{display:block;color:#8b8586;margin-top:3px}.row strong{font-size:20px}.chev{color:#aaa}.primary{border:0;width:100%;padding:17px;border-radius:18px;background:#dd755d;color:#fff;font-weight:750;font-size:17px;margin-top:18px}.secondary{border:1px solid #d9d1c9;width:100%;padding:14px;border-radius:16px;background:transparent;color:#4c4749;font-weight:650;margin-top:10px}.sheet{display:none;position:absolute;inset:0;background:#171421aa;z-index:3;align-items:flex-end}.sheet.open{display:flex}.panel{background:#fbf7ef;width:100%;max-height:82%;border-radius:30px 30px 0 0;padding:18px 20px 30px;color:#29252a;overflow:auto}.handle{width:42px;height:5px;border-radius:5px;background:#cec7c3;margin:0 auto 20px}.panel h2{font-size:28px;margin:0 0 6px}.panel>p{color:#7b7375;margin:0 0 18px}.times{display:grid;gap:10px}.time-card{border:1px solid #e0d9d3;background:#fff;border-radius:18px;padding:15px 16px;display:flex;justify-content:space-between;align-items:center;font:inherit;text-align:left}.time-card b{font-size:21px}.time-card small{display:block;color:#80787b}.time-card.on{border:2px solid #d96f58;background:#fff4ee}.playlist{display:flex;gap:13px;align-items:center}.cover{width:54px;height:54px;border-radius:16px;background:linear-gradient(145deg,#332d4d,#f49a73);display:grid;place-items:center;color:#fff;font-size:22px}.track{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #ece5dd}.grip{color:#aaa}.empty{padding:24px;text-align:center;border:1px dashed #cfc5bd;border-radius:18px;color:#756d70}.nav{display:flex;position:absolute;left:20px;right:20px;bottom:18px;background:#28243a;border-radius:20px;padding:6px;gap:6px}.nav button{flex:1;border:0;border-radius:15px;padding:11px;background:transparent;color:#c7c0d2}.nav button.on{background:#fff;color:#2d2836;font-weight:700}
</style></head><body><main class="phone"><header class="top"><div class="brand">WARMLY · TONIGHT</div><h1>오늘 밤의<br>수면 계획</h1><p>한 장에서 확인하고 필요한 것만 바꿔요.</p><div class="prototype-note" style="padding:6px 22px;background:#fff2d8;color:#654f26">상호작용 UI 시안 · 저장·알람 예약 안 됨</div></header><section class="content"><div class="section-title">내 수면 계획 시안</div><div class="plan"><button class="row" onclick="openSheet('time')"><span>일어날 시간<small>선택값 편집</small></span><strong><span id="planner-wake">07:00</span> <i class="chev">›</i></strong></button><button class="row" onclick="openSheet('bed')"><span>잘 시간<small>일반적인 수면 시간 참고</small></span><strong><span id="planner-bed">22:45</span> <i class="chev">›</i></strong></button><button class="row" onclick="openSheet('music')"><span class="playlist"><i class="cover">♪</i><span>플레이리스트 화면<small>후속 개발 범위</small></span></span><i class="chev">›</i></button></div><button class="primary" onclick="this.textContent='홈 상태 UI 시안 · 실제 예약 없음'">홈 결과 시안 보기</button><button class="secondary" onclick="openSheet('preview')">미리 체험 화면 보기</button></section><nav class="nav"><button class="on">오늘</button><button onclick="openSheet('music')">음악 시안</button><button>설정 시안</button></nav>
<div class="sheet" id="time"><div class="panel"><div class="handle"></div><h2>일어날 시간</h2><p>15분 단위 상호작용 시안입니다.</p><div id="time-value" style="font-size:64px;text-align:center;font-weight:750;margin:35px 0">07:00</div><button class="secondary" onclick="adjustPlannerWake(-15)">15분 앞당기기</button><button class="secondary" onclick="adjustPlannerWake(15)">15분 늦추기</button><button class="primary" onclick="closeSheets()">선택 반영</button></div></div>
<div class="sheet" id="bed"><div class="panel"><div class="handle"></div><h2>잘 시간 추천</h2><p>일반적인 수면 시간을 참고했으며 개인차가 있어요.</p><div class="times"><button class="time-card" data-duration="555" onclick="selectCard(this)"><span><b></b><small>약 9시간 수면</small></span><span>🌙</span></button><button class="time-card on" data-duration="495" onclick="selectCard(this)"><span><b></b><small>약 8시간 수면</small></span><span>✓</span></button><button class="time-card" data-duration="465" onclick="selectCard(this)"><span><b></b><small>약 7시간 30분 수면</small></span><span>☾</span></button></div><button class="secondary" onclick="selectCustom(this)">직접 설정 · 22:30</button><button class="primary" onclick="closeSheets()">선택 반영</button></div></div>
<div class="sheet" id="music"><div class="panel"><div class="handle"></div><h2>플레이리스트 편집 시안</h2><p>이 시안의 곡은 저장되지 않습니다.</p><div id="tracks"><div class="track"><span class="grip">☰</span><i class="cover">♪</i><span><b>Morning Light</b><small style="display:block;color:#8b8385">화면 예시</small></span></div></div><button class="secondary" onclick="addTrack()">＋ 곡 추가 UI 보기</button><button class="primary" onclick="closeSheets()">편집 화면 닫기</button></div></div>
<div class="sheet" id="preview"><div class="panel"><div class="handle"></div><h2>미리 체험 화면 시안</h2><p>재생·진동은 실행되지 않습니다.</p><div style="height:240px;border-radius:24px;background:linear-gradient(#211b39,#b76563,#ffd3a5);display:grid;place-items:center;color:#fff;font-size:42px">☀</div><button class="primary" onclick="closeSheets()">시안 닫기</button></div></div>
</main><script>let plannerWake=420,plannerBed=1365;const plannerHm=m=>String(Math.floor((m+1440)%1440/60)).padStart(2,'0')+':'+String((m+1440)%1440%60).padStart(2,'0');function renderPlanner(){document.getElementById('planner-wake').textContent=plannerHm(plannerWake);document.getElementById('time-value').textContent=plannerHm(plannerWake);document.querySelectorAll('.time-card').forEach(x=>{let value=(plannerWake-Number(x.dataset.duration)+1440)%1440;x.dataset.minutes=value;x.querySelector('b').textContent=plannerHm(value)});let selected=document.querySelector('.time-card.on');if(selected)plannerBed=Number(selected.dataset.minutes);document.getElementById('planner-bed').textContent=plannerHm(plannerBed)}function openSheet(x){renderPlanner();document.getElementById(x).classList.add('open')}function closeSheets(){renderPlanner();document.querySelectorAll('.sheet').forEach(x=>x.classList.remove('open'))}function adjustPlannerWake(d){plannerWake=(plannerWake+d+1440)%1440;renderPlanner()}function selectCard(x){document.querySelectorAll('.time-card').forEach(y=>y.classList.remove('on'));x.classList.add('on');plannerBed=Number(x.dataset.minutes);renderPlanner()}function selectCustom(x){document.querySelectorAll('.time-card').forEach(y=>y.classList.remove('on'));plannerBed=1350;x.textContent='직접 설정 · 22:30 선택됨';renderPlanner()}function addTrack(){let d=document.createElement('div');d.className='track';d.innerHTML='<span class="grip">☰</span><i class="cover">＋</i><span><b>곡 추가 UI 예시</b><small style="display:block;color:#8b8385">저장되지 않음</small></span>';document.getElementById('tracks').appendChild(d)}renderPlanner()</script></body></html>
